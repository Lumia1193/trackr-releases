name: Preserve releases and remove personal commit emails
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/privacy-cleanup.yml'
permissions:
  contents: write
concurrency:
  group: privacy-cleanup
  cancel-in-progress: false
jobs:
  clean_metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite metadata with exact tree and release checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'ORBIT_PRIVACY_NODE'
          'use strict';
          // Runs only inside one explicitly allowed GitHub release repository.
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const repo=process.env.GITHUB_REPOSITORY;
          assert.ok(['Lumia1193/orbit-releases','Lumia1193/apple-music-releases','Lumia1193/trackr-releases'].includes(repo));
          assert.ok(process.env.GITHUB_TOKEN&&process.env.GITHUB_SHA);
          const noreply='262221876+Lumia1193@users.noreply.github.com',folder='privacy-mirror.git';
          const git=(args,input)=>execFileSync('git',['--git-dir='+folder,...args],{input,encoding:input===undefined?'utf8':undefined,maxBuffer:50000000,stdio:['pipe','pipe','pipe']});
          async function metadata(){const response=await fetch('https://api.github.com/repos/'+repo+'/releases?per_page=100',{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN}});assert.equal(response.status,200);return(await response.json()).map(r=>({id:r.id,tag:r.tag_name,assets:r.assets.map(a=>({id:a.id,name:a.name,size:a.size,digest:a.digest,url:a.browser_download_url}))}));}
          (async()=>{const releasesBefore=await metadata();execFileSync('git',['clone','--mirror','--quiet','https://github.com/'+repo+'.git',folder],{stdio:'pipe'});
          const refs=git(['for-each-ref','--format=%(refname) %(objectname) %(objecttype)']).trim().split('\n').map(l=>{const [ref,sha,type]=l.split(' ');return {ref,sha,type};});
          assert.ok(refs.every(r=>r.type==='commit'&&/^refs\/(heads|tags)\//.test(r.ref)),'Unexpected reference type');assert.equal(refs.find(r=>r.ref==='refs/heads/main')?.sha,process.env.GITHUB_SHA,'Repository changed since approved run');
          const commits=git(['rev-list','--reverse','--topo-order','--all']).trim().split('\n'),mapping=new Map();let replaced=0;
          for(const id of commits){const old=Buffer.from(git(['cat-file','commit',id])),split=old.indexOf('\n\n'),message=old.subarray(split+2),next=[];let signature=false;
          for(let line of old.subarray(0,split).toString().split('\n')){if(/^gpgsig(?:-sha256)? /.test(line)){signature=true;continue;}if(signature&&line.startsWith(' '))continue;signature=false;if(line.startsWith('parent ')){assert.ok(mapping.has(line.slice(7)));line='parent '+mapping.get(line.slice(7));}if(/^(author|committer) /.test(line)&&/<[^>]+@gmail\.com>/.test(line)){line=line.replace(/<[^>]+@gmail\.com>/,'<'+noreply+'>');replaced++;}next.push(line);}
          const bytes=Buffer.concat([Buffer.from(next.join('\n')+'\n\n'),message]),fresh=git(['hash-object','-t','commit','-w','--stdin'],bytes).toString().trim();mapping.set(id,fresh);assert.equal(git(['rev-parse',id+'^{tree}']).trim(),git(['rev-parse',fresh+'^{tree}']).trim(),'File contents changed');assert.ok(!/^(author|committer) .*@gmail\.com>/m.test(bytes.subarray(0,bytes.indexOf('\n\n')).toString()));}
          const updates=refs.map(r=>({...r,next:mapping.get(r.sha)}));git(['update-ref','--stdin'],Buffer.from('start\n'+updates.map(r=>'update '+r.ref+' '+r.next+' '+r.sha).join('\n')+'\nprepare\ncommit\n'));
          assert.equal(git(['rev-list','--all','--count']).trim(),String(commits.length));for(const r of updates)assert.equal(git(['rev-parse',r.next+'^{tree}']).trim(),git(['rev-parse',r.sha+'^{tree}']).trim());
          // Exact leases + one atomic push: either every reference changes or none does.
          const leases=updates.map(r=>'--force-with-lease='+r.ref+':'+r.sha),refspecs=updates.map(r=>r.ref+':'+r.ref);
          const env={...process.env,GIT_TERMINAL_PROMPT:'0',GIT_CONFIG_COUNT:'2',GIT_CONFIG_KEY_0:'http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+Buffer.from('x-access-token:'+process.env.GITHUB_TOKEN).toString('base64'),GIT_CONFIG_KEY_1:'remote.origin.mirror',GIT_CONFIG_VALUE_1:'false'};
          try{execFileSync('git',['--git-dir='+folder,'push','--atomic',...leases,'origin',...refspecs],{env,stdio:'pipe'});}catch{throw Error('Atomic push rejected. No permission or protection bypass was attempted. Inspect remote refs before retrying.');}
          assert.deepEqual(await metadata(),releasesBefore,'Release assets changed unexpectedly');const remote=git(['ls-remote','origin']).trim().split('\n');for(const r of updates)assert.ok(remote.includes(r.next+'\t'+r.ref),'Reference verification failed');
          console.log('PASS: '+repo+'; '+commits.length+' commits; '+replaced+' personal author/committer fields replaced. Every file tree and every release asset retained. All branch and tag names preserved. Old cached commits may still require GitHub Support removal.');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          
          ORBIT_PRIVACY_NODE
