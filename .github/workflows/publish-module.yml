name: Publish TRACKR integrated settings
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-module.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare verified public files
        run: |
          curl --fail --location --retry 3 'https://github.com/Lumia1193/trackr-releases/releases/download/module-build-2026101402/trackr-1.0.module.zip' --output base.zip
          python3 - <<'PY'
          import base64,gzip,hashlib,json,zipfile
          base=open('base.zip','rb').read()
          assert hashlib.sha256(base).hexdigest()=='e1aa0d0cd39998e19e8908786d579536e4d8279d0b15b0f6e44b9ba14dd9e7d9'
          recipe=json.loads(gzip.decompress(base64.b64decode('')))
          result=b''.join(base64.b64decode(p['literal']) if 'literal' in p else base[p['offset']:p['offset']+p['length']] for p in recipe)
          assert hashlib.sha256(result).hexdigest()=='f742e1dfaf62a5faea50b881e129092b807893a537bbf928654a36c1fe1d8d1c'
          open('trackr-1.0.module.zip','wb').write(result)
          with zipfile.ZipFile('trackr-1.0.module.zip') as package:
              assert all(not name.lower().endswith(('.icue','.icuewidget')) for name in package.namelist())
          print('Verified exact tested module SHA256:',hashlib.sha256(result).hexdigest())
          PY
      - name: Publish version 1.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view module-build-2026101403 --repo "$GH_REPO" >/dev/null 2>&1; then echo 'Release exists; previous files preserved.'; exit 0; fi
          gh release create module-build-2026101403 trackr-1.0.module.zip --repo "$GH_REPO" --title 'TRACKR 1.0' --notes 'Headless TRACKR module for integrated Orbit settings. Steam login, API key, widget authorization and automatic library backup approval remain protected. Existing data paths and backup safeguards preserved. No iCUE package included. Public version 1.0.'
